[project]
name = "jax-shac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.4.0",
    "brax==0.9.4",
    "evdev>=1.9.3",
    "flax>=0.12.3",
    "jax[cuda13]>=0.7.2",
    "jaxlib>=0.4.6",
    "matplotlib>=3.10.8",
    "mediapy>=1.2.6",
    "mujoco>=3.8.1",
    "mujoco-mjx>=3.8.1",
    "mujoco-menagerie==2026.9.0",
    "numpy>=2.3.5",
    "optax>=0.2.7",
    "pygame>=2.6.1",
    "pynput>=1.8.1",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "typing-extensions>=4.15.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"jax_shac.shac" = "shac"
"jax_shac.envs" = "envs"
"jax_shac.utils" = "utils"

# mujoco_warp is a local clone of PR #1535 (+ fixes), not a workspace member:
# as a member, its [tool.uv.sources] would pull nightly mujoco into the whole
# project and break the MJX pairing below.
[tool.uv.sources]
mujoco-warp = { path = "third_party/mujoco_warp", editable = true }

[tool.uv]
# ignore mujoco_warp's own sources (nightly mujoco index, NVIDIA index for warp):
# mujoco and warp-lang come from PyPI like everything else.
no-sources-package = ["mujoco", "warp-lang"]
constraint-dependencies = ["mujoco==3.13.0", "mujoco-mjx==3.13.0"]

[tool.setuptools]
packages = ["jax_shac", "jax_shac.shac", "jax_shac.envs", "jax_shac.utils"]

[dependency-groups]
dev = [
    "notebook>=7.5.3",
    "jaxtyping>=0.2.28",
    "typeguard>=2.13,<3",
    "ipykernel>=6.29.0",
    "pytest>=9.2.0",
]
warp = [
    "mujoco-warp",
]

[tool.pytest.ini_options]
pythonpath = ["."]
